name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs these to publish to Pages; nothing else does.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run is allowed to finish rather than being
# cancelled, so a half-published site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Whether the Cloudflare Pages secrets exist. A step's `if` cannot read a
      # secret directly, so the answer is carried here.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The tests are the gate. The PIN authority table, the hierarchy and the
      # activity log all have tests behind them, so a change that breaks one of
      # those rules never reaches the published site.
      - run: npx vitest run

      # The shared server. Both values come from the Supabase project's
      # Settings → API page and are set as repository secrets; the anon key is
      # meant to be public — the server refuses anything it is not shown a
      # valid session for. Without them the build runs on one browser only.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Cloudflare Pages: free, no limit on traffic, and — unlike GitHub Pages
      # on a free plan — it publishes from a private repository. Does nothing
      # until the two secrets are added; see docs/spec/hosting.md.
      #
      # The `legendary-crm` project was created once, on 24 September. While the
      # repository is public GitHub Pages carries the site too, so a Cloudflare
      # hiccup must not stop that copy being published; once it is private,
      # Cloudflare is the only copy and a failure fails the run.
      - name: Publish to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        continue-on-error: ${{ !github.event.repository.private }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name legendary-crm --branch main --commit-dirty=true

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: dist

  # GitHub Pages, for as long as the repository is public. A free plan cannot
  # publish Pages from a private one, so this steps aside by itself once the
  # repository is made private and Cloudflare carries the site.
  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
