name: Nightly backup

# 02:30 in Malaysia, when every store has closed and nobody is signed in.
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      keep:
        description: 'Also keep this one permanently, as a monthly backup would be'
        type: boolean
        default: false

permissions:
  # To attach the monthly backup to a release, which is kept for good.
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A throwaway database, gone when the job ends. Every backup is unlocked
    # again, restored into it and counted, so one that could not be put back
    # fails tonight — not on the day it is needed.
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: scratch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12

    # No secret is given to the whole job: each goes only to the steps that
    # use it. And every step that holds one runs before any code from npm
    # does — the restore test, which needs the pg package, comes last — so
    # nothing a package brings in can read a secret or change how a step that
    # holds one runs.
    env:
      SCRATCH: postgresql://postgres:scratch@localhost:5432/postgres
      TABLES: people docs locations settings
      # Whether the Backups page's Cloudflare copy is set up. A step's `if`
      # cannot read a secret directly, so the answer is carried here.
      HAS_CLOUDFLARE: ${{ secrets.CF_KV_TOKEN != '' }}
      # The server's certificate is checked against Supabase's own root, so
      # the backup cannot be quietly pointed somewhere else.
      PGSSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/supabase-ca.crt

    steps:
      - uses: actions/checkout@v4
        with:
          # Leaves no token in .git/config for a later step's code to find.
          persist-credentials: false

      - name: Check the secrets are set
        env:
          SOURCE: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$SOURCE" ] || { echo "::error::BACKUP_DATABASE_URL is not set"; exit 1; }
          [ -n "$PASSPHRASE" ] || { echo "::error::BACKUP_PASSPHRASE is not set"; exit 1; }

      # The server is Postgres 17, and pg_dump refuses a newer server than itself.
      - name: Install the Postgres 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Take the backup
        env:
          SOURCE: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p out
          stamp=$(TZ=Asia/Kuala_Lumpur date +%Y-%m-%d_%H%M)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          echo "TAKEN_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "### Backup $stamp" >> "$GITHUB_STEP_SUMMARY"
          args=(); for t in $TABLES; do args+=(--table="public.$t"); done

          count() { for t in $TABLES; do psql "$SOURCE" -Atc "select '$t', count(*) from public.$t"; done; }
          count > out/counts-before.txt

          pg_dump "$SOURCE" --schema-only --no-owner --no-privileges "${args[@]}" > out/schema.sql
          # Row-by-row with column names, so it restores into a server whose
          # columns have moved about since.
          pg_dump "$SOURCE" --data-only --enable-row-security --column-inserts \
            --rows-per-insert=200 "${args[@]}" > out/data.sql

          count > out/counts-after.txt
          echo "Dump: $(du -h out/data.sql | cut -f1) of data."

      # What the Backups page lists beside each backup: when it was taken and
      # the job's own counts. Worked out now; Encrypt shreds the counts.
      - name: Describe it
        run: |
          set -euo pipefail
          counts=$(awk -F'|' 'NF == 2 { printf "%s\"%s\":%s", (n++ ? "," : ""), $1, $2 }' out/counts-before.txt)
          echo "META={\"takenAt\":\"$TAKEN_AT\",\"counts\":{$counts}}" >> "$GITHUB_ENV"

      - name: Encrypt
        id: encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          name="legendary-crm-$STAMP"
          echo "NAME=$name" >> "$GITHUB_ENV"
          tar -C out -czf "$name.tar.gz" schema.sql data.sql counts-before.txt counts-after.txt
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --quiet --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$name.tar.gz.gpg" "$name.tar.gz"
          # Nothing readable is left lying about on the runner.
          shred -u "$name.tar.gz" out/*
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Encrypted: $(du -h "$name.tar.gz.gpg" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      # Thirty nights, kept by GitHub and deleted after.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error

      # The first night of each month is also kept for good, as a release.
      - name: Keep the monthly one
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep }}
        run: |
          set -euo pipefail
          day=$(TZ=Asia/Kuala_Lumpur date +%d)
          if [ "$day" = "01" ] || [ "$KEEP" = "true" ]; then
            tag="backup-${STAMP%%_*}"
            gh release create "$tag" "$NAME.tar.gz.gpg" \
              --title "Backup ${STAMP%%_*}" \
              --notes "Encrypted with the backup passphrase. See README.md to restore." \
              || gh release upload "$tag" "$NAME.tar.gz.gpg" --clobber
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Kept permanently as release $tag." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A second copy, in Cloudflare: what crm.legendary.com.my/backups lists
      # and opens. After the GitHub copies, so a Cloudflare outage never costs
      # them. Skipped until scripts/backup-page-setup.mjs has set its secrets.
      - name: Copy to Cloudflare
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CF_KV_TOKEN: ${{ secrets.CF_KV_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE: ${{ secrets.CF_KV_NAMESPACE }}
          KEEP: ${{ inputs.keep }}
        run: |
          set -euo pipefail
          size=$(stat -c%s "$NAME.tar.gz.gpg")
          # One KV value holds 25 MiB at most; stop well before, loudly.
          if [ "$size" -gt 25165824 ]; then
            echo "::error::The encrypted backup is $size bytes, over the 24 MiB a KV value may safely hold. Split it, or move the copy to R2."
            exit 1
          fi
          meta=$(jq -c --argjson size "$size" '. + {sizeBytes: $size}' <<<"$META")
          put() {
            curl -fsS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE/values/$1" \
              -H "Authorization: Bearer $CF_KV_TOKEN" \
              -F "value=@$NAME.tar.gz.gpg" -F "metadata=$meta" > /dev/null
          }
          # Thirty-one nights, then KV deletes it by itself.
          put "nightly%2F$STAMP?expiration_ttl=2678400"
          day=$(TZ=Asia/Kuala_Lumpur date +%d)
          if [ "$day" = "01" ] || [ "$KEEP" = "true" ]; then
            put "monthly%2F${STAMP%%_*}"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Copied to Cloudflare for the Backups page." >> "$GITHUB_STEP_SUMMARY"

      # The test. It unlocks the very file that was kept, as a person restoring
      # it would, so a backup that would not unlock fails tonight too. It runs
      # even when a copy above failed, as long as there is a file to test, and
      # it is the last step to hold a secret.
      - name: Unlock it again, as a restore would
        id: unlock
        if: ${{ !cancelled() && steps.encrypt.outcome == 'success' }}
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p out
          printf '%s' "$PASSPHRASE" | gpg --batch --quiet --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt "$NAME.tar.gz.gpg" | tar -xzf - -C out

      - name: Restore it into the scratch database
        id: restore
        if: ${{ !cancelled() && steps.unlock.outcome == 'success' }}
        env:
          PGSSLMODE: disable
        run: |
          set -euo pipefail
          # Exactly the versions in package-lock.json, and none of their
          # install scripts.
          npm ci --ignore-scripts --silent --no-audit --no-fund
          psql "$SCRATCH" -v ON_ERROR_STOP=1 -q -f scratch-setup.sql
          psql "$SCRATCH" -v ON_ERROR_STOP=1 -q -f out/schema.sql
          DATABASE_URL="$SCRATCH" node restore.mjs out/data.sql --yes

      - name: Check nothing went missing
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          PGSSLMODE: disable
        run: |
          set -euo pipefail
          # Rows are only ever added between the two counts (sales are taken
          # back by marking them, not deleting them), so the restored count
          # must sit between the count before the dump and the count after.
          ok=1
          {
            echo
            echo "| Table | Before | Restored | After |"
            echo "|---|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          for t in $TABLES; do
            before=$(grep "^$t|" out/counts-before.txt | cut -d'|' -f2)
            after=$(grep "^$t|" out/counts-after.txt | cut -d'|' -f2)
            got=$(psql "$SCRATCH" -Atc "select count(*) from public.$t")
            echo "| $t | $before | $got | $after |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$got" -lt "$before" ] || [ "$got" -gt "$after" ]; then
              echo "::error::$t restored $got rows; expected between $before and $after"
              ok=0
            fi
          done
          [ "$ok" = 1 ]

      # Whatever happened above, nothing readable is left on the runner.
      - name: Shred what was unlocked
        if: always()
        run: |
          if [ -d out ]; then find out -type f -exec shred -u {} +; fi
