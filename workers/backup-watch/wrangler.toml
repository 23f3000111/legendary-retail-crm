# The morning check that last night's backup reached Cloudflare
# (ops/backup/README.md). Deployed by hand, once, with the KV-and-Workers token:
#
#   CLOUDFLARE_API_TOKEN=$CLOUDFLARE_BACKUP_TOKEN npx wrangler@4 deploy
#   npx wrangler@4 secret put RESEND_API_KEY      (and ALERT_EMAILS, ALERT_REPLY_TO)
name = "legendary-crm-backup-watch"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = false

[triggers]
# 08:00 UTC is 16:00 in Malaysia. GitHub has started the nightly job as late as
# 09:45, so at 11:00 a backup missed after such a night was only 25 hours old
# and passed; at 16:00 it is past 30 hours and reported the same day, while a
# backup that did come in is at most 11 hours old (final review, 19 November).
crons = ["0 8 * * *"]

[[kv_namespaces]]
binding = "BACKUPS"
# The id scripts/backup-page-setup.mjs prints for legendary-crm-backups.
id = "SET_BY_SETUP"
